# Container deployment. Copy this file next to a config.ini + certs/ directory, then:
#   docker compose up -d
#
# network_mode: host is intentional: the mail proxy must own 993/995/465 and the
# backends must see a real IP, not a container bridge address.
services:
  mam:
    build:
      context: ..
    image: mam-portal:local
    container_name: mam-portal
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    environment:
      NODE_ENV: production
      CONFIG_PATH: /app/etc/config.ini
      DATA_DIR: /app/data
    volumes:
      - ./etc:/app/etc
      - ./certs:/app/certs:ro
      - mam-data:/app/data

volumes:
  mam-data:
