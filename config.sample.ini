; Copy jadi config.ini
; Jangan commit config.ini ke repo.

[DEFAULT]
default_domain = example.com

[WEB]
https_enabled = false
http_port = 8080
https_port = 8443
tls_key_file = certs/server.key
tls_cert_file = certs/server.crt

[ADMIN]
base_path = /admin
session_secret = CHANGE_ME_SESSION_SECRET

; Mail proxy: IMAPS/POP3S/SMTPS lewat satu hostname, diteruskan ke server
; tempat akun berada (pakai peta domain MaMKey_* di bawah). Lihat docs/mail-proxy.md
[MAIL]
enabled = false
hostname = mail.example.com
bind_host = 0.0.0.0
imaps_port = 993
pop3s_port = 995
smtps_port = 465
tls_cert_file = certs/mail.crt
tls_key_file = certs/mail.key
; Kirim IP asli client ke backend (IMAP ID X-ORIGINATING-IP, POP3 XOIP, SMTP XCLIENT).
; Butuh IP MaM di zimbraMailTrustedIP dan smtpd_authorized_xclient_hosts tiap backend.
send_originating_ip = true
max_conn_per_ip = 20
max_conn_total = 2000
prelogin_timeout_sec = 60
auth_fail_per_ip = 10
auth_fail_per_user = 5
auth_fail_window_sec = 600

; 1 server bisa banyak domain
[MaMKey_1]
name = Zimbra Primary
server = https://mail1.example.com
domains = example.com,example.co.id
preauthkey = CHANGE_ME_1

; Kalau cert Zimbra internal (AMAN):
; ca_file = certs/internal-ca.pem

; Testing doang (TIDAK AMAN):
; insecure_tls = true

; Mail proxy (opsional). Default: host dari "server", port 993/995/465.
; mail_host = 10.0.0.11
; mail_servername = mail1.example.com
; imap_port = 993
; pop3_port = 995
; smtps_port = 465

; domain sama untuk fallback (urutan coba sesuai config.ini)
[MaMKey_2]
name = Zimbra Secondary (fallback)
server = https://mail2.example.com
domains = example.com
preauthkey = CHANGE_ME_2
