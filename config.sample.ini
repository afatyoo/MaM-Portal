; Copy jadi config.ini
; Jangan commit config.ini ke repo.

[DEFAULT]
default_domain = example.com

[WEB]
; Tanpa HTTPS, web hanya boleh dibuka di mesin ini (di belakang reverse proxy TLS).
; Untuk akses langsung dari jaringan: aktifkan https_enabled lalu kosongkan bind_host.
bind_host = 127.0.0.1
; Isi kalau di belakang reverse proxy supaya IP client asli terbaca:
;   loopback (proxy di mesin yang sama) atau jumlah hop, mis. 1
; trust_proxy = loopback
; Batas gagal login web & admin per jendela waktu
login_fail_per_ip = 20
login_fail_per_user = 5
login_fail_window_sec = 600
https_enabled = false
http_port = 8080
https_port = 8443
tls_key_file = certs/server.key
tls_cert_file = certs/server.crt

[ADMIN]
base_path = /admin
session_secret = CHANGE_ME_SESSION_SECRET

; Mail proxy: IMAPS/POP3S/SMTPS lewat satu hostname, diteruskan ke server
; tempat akun berada (pakai peta domain MaMKey_* di bawah). Lihat docs/mail-proxy.md
[MAIL]
enabled = false
hostname = mail.example.com
bind_host = 0.0.0.0
imaps_port = 993
pop3s_port = 995
smtps_port = 465
tls_cert_file = certs/mail.crt
tls_key_file = certs/mail.key
; Kirim IP asli client ke backend (IMAP ID X-ORIGINATING-IP, POP3 XOIP, SMTP XCLIENT).
; Butuh IP MaM di zimbraMailTrustedIP dan smtpd_authorized_xclient_hosts tiap backend.
send_originating_ip = true
max_conn_per_ip = 20
max_conn_total = 2000
prelogin_timeout_sec = 60
idle_timeout_sec = 2100
backend_timeout_sec = 15
handshake_timeout_sec = 30
auth_fail_per_ip = 10
auth_fail_per_user = 5
auth_fail_window_sec = 600
; Batas jumlah IP/user yang disimpan di penghitung gagal login (anti memori bengkak).
fail_limiter_max_keys = 20000

; Cache email -> server. Kalau satu domain ada di dua server, backend yang menolak
; menahan jawaban ~10 detik. Cache bikin login berikutnya cuma coba satu server.
; File hanya berisi alamat email dan key server (tanpa password), mode 0600.
; Atur route_cache_enabled = false kalau tidak mau ada file sama sekali.
route_cache_enabled = true
route_cache_file = data/mail-route-cache.json
route_cache_ttl_days = 90
route_cache_max_entries = 50000

; 1 server bisa banyak domain
[MaMKey_1]
name = Zimbra Primary
server = https://mail1.example.com
domains = example.com,example.co.id
preauthkey = CHANGE_ME_1

; Kalau cert Zimbra internal (AMAN):
; ca_file = certs/internal-ca.pem

; Testing doang (TIDAK AMAN):
; insecure_tls = true

; Mail proxy (opsional). Default: host dari "server", port 993/995/465.
; PENTING: di Carbonio/Zimbra, 993 dan 995 itu nginx. Supaya IP asli client
; benar-benar sampai (IMAP ID X-ORIGINATING-IP / POP3 XOIP), tembak mailboxd
; langsung: 7993 (IMAPS) dan 7995 (POP3S). SMTP 465 tetap ke Postfix.
; mail_host = 10.0.0.11
; mail_servername = mail1.example.com
; imap_port = 7993
; pop3_port = 7995
; smtps_port = 465

; domain sama untuk fallback (urutan coba sesuai config.ini)
[MaMKey_2]
name = Zimbra Secondary (fallback)
server = https://mail2.example.com
domains = example.com
preauthkey = CHANGE_ME_2
